<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AJID — Site Manager</title>
<link rel="icon" href="/assets/logo/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Hayyakum";src:url("/assets/fonts/HayyakumAllah-Light.woff2") format("woff2");font-weight:300;font-display:swap}
@font-face{font-family:"Hayyakum";src:url("/assets/fonts/HayyakumAllah-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Hayyakum";src:url("/assets/fonts/HayyakumAllah-Medium.woff2") format("woff2");font-weight:500;font-display:swap}

:root{
  --navy:#061229; --sand:#d5cfc6; --brown:#582c00; --gray:#828282;
  --burgundy:#4d1615; --mist:#748796;
  --panel:#0b1a33; --line:rgba(213,207,198,.18); --dim:rgba(213,207,198,.62);
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--navy);color:var(--sand);
  font-family:"Hayyakum",Georgia,serif;font-size:15px;line-height:1.5;
  display:grid;grid-template-columns:minmax(420px,44%) 1fr;height:100vh;overflow:hidden}
@media(max-width:1000px){body{grid-template-columns:1fr;overflow:auto;height:auto}
  #preview-pane{height:70vh;position:static!important}}

/* ---------- editor column ---------- */
#editor{overflow-y:auto;padding:0 0 80px}
.bar{position:sticky;top:0;z-index:5;background:var(--navy);border-bottom:1px solid var(--line);
  padding:14px 22px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar h1{font-size:16px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin:0;flex:1}
.bar .logo{width:34px}
.bar .logo svg{width:100%;height:auto;fill:var(--sand)}

button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--sand);
  padding:8px 16px;border-radius:2px;letter-spacing:.08em;transition:.2s}
button:hover{background:rgba(213,207,198,.1)}
button.primary{background:var(--sand);color:var(--navy);border-color:var(--sand);font-weight:500}
button.primary:hover{opacity:.85}
button.sm{padding:4px 10px;font-size:12px}
button.danger:hover{background:var(--burgundy);border-color:var(--burgundy)}

.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);padding:0 22px;position:sticky;top:57px;
  background:var(--navy);z-index:4}
.tab{padding:12px 18px;border:0;border-bottom:2px solid transparent;letter-spacing:.1em;
  text-transform:uppercase;font-size:12px;color:var(--dim);border-radius:0}
.tab.on{color:var(--sand);border-bottom-color:var(--sand)}
.tab:hover{background:transparent;color:var(--sand)}

.pane{display:none;padding:22px}
.pane.on{display:block}

fieldset{border:1px solid var(--line);border-radius:3px;padding:16px;margin:0 0 18px}
legend{padding:0 8px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}

label{display:block;margin-bottom:14px}
label>span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dim);margin-bottom:5px}
input[type=text],textarea,input[type=url],select{width:100%;background:var(--panel);color:var(--sand);
  border:1px solid var(--line);border-radius:2px;padding:9px 11px;font:inherit;font-size:14px}
select{cursor:pointer}
select option{background:var(--panel);color:var(--sand)}
input:focus,textarea:focus{outline:1px solid var(--sand);outline-offset:-1px}
textarea{resize:vertical;min-height:84px;line-height:1.6}
[dir=rtl] input,[dir=rtl] textarea{text-align:right}

/* colour rows */
.crow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.crow span.nm{flex:1;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.crow input[type=color]{width:44px;height:32px;padding:0;border:1px solid var(--line);
  background:transparent;border-radius:2px;cursor:pointer}
.crow input[type=text]{width:104px;font-size:13px}
.swatches{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sw{width:30px;height:30px;border-radius:2px;border:1px solid var(--line);cursor:pointer;padding:0}
.sw:hover{transform:scale(1.12)}

/* repeatable item cards */
.item{border:1px solid var(--line);border-radius:3px;padding:12px;margin-bottom:10px;
  background:rgba(213,207,198,.03)}
.item .hd{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.item .hd strong{flex:1;font-weight:500;font-size:13px;letter-spacing:.06em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:620px){.grid2{grid-template-columns:1fr}}

.imgpick{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.imgpick img{width:58px;height:72px;object-fit:cover;border:1px solid var(--line);background:var(--panel)}
.imgpick .col{flex:1;min-width:0}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)}
.chk input{width:16px;height:16px}

/* preview column */
#preview-pane{position:relative;border-left:1px solid var(--line);background:var(--sand);
  display:flex;flex-direction:column}
#preview-bar{display:flex;gap:8px;align-items:center;padding:8px 12px;background:var(--navy);
  border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.08em}
#preview-bar .sp{flex:1}
iframe{flex:1;width:100%;border:0;background:var(--sand)}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);
  background:var(--sand);color:var(--navy);padding:11px 22px;border-radius:2px;font-weight:500;
  opacity:0;pointer-events:none;transition:.35s;z-index:50;letter-spacing:.06em}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.hint{font-size:12px;color:var(--dim);line-height:1.6;margin:-6px 0 14px}
</style>
</head>
<body>

<div id="editor">
  <div class="bar">
    <span class="logo"><svg viewBox="330 380 400 320"><path d="M684.47,634.51c-13.63,0-24.68,11.05-24.68,24.68s11.05,24.68,24.68,24.68,24.68-11.05,24.68-24.68-11.05-24.68-24.68-24.68Z"/><polygon points="606.31 634.86 595.63 605.46 552.26 605.46 562.57 634.44 562.97 682.29 632.89 682.29 606.31 634.44 606.31 634.86"/><path d="M655.12,558.23h-76.63l-58.85-162.1h-66.21l.02.12h-8.62c1.56,1.34,4.3,3.88,7,7.58,14.58,19.98,9.92,49.39,2.22,74.11l-.15.43c-.02.07-.05.17-.07.25l-8.64,23.85c-4.26,11.77-8.52,23.54-12.77,35.32h28.47l33.43-92.59,40.82,113.05c-23.48.05-47.01.1-70.51.15v.05h-79.8c2.8,2.38,5.08,4.94,7.02,7.56,19.43,26.92,2.97,70.59-9.92,96.4l-10.83,19.53c-.07.12-.15.25-.22.37h54.35l.42-47.84,17.83-49.05c.1-.15.2-.27.32-.42,37.92.02,75.82-.49,113.71-.17,10.61.07,21.44.12,32.32.52,23.21.81,46.57,3.27,68.08,11.32.71.27,1.42.54,2.14.83l-4.91-39.25Z"/></svg></span>
    <h1>Site Manager</h1>
    <button class="sm" id="btnExport">Export</button>
    <button class="sm" id="btnImport">Import</button>
    <button class="primary" id="btnSave">Save &amp; Publish</button>
  </div>

  <div class="tabs">
    <button class="tab on" data-pane="theme">Colours</button>
    <button class="tab" data-pane="en">English</button>

  <div class="pane on" id="pane-theme"></div>
  <div class="pane" id="pane-en"></div>
  <div class="pane" id="pane-ar"></div>
  <div class="pane" id="pane-media"></div>
</div>

<div id="preview-pane">
  <div id="preview-bar">
    <button class="sm" data-view="/">English</button>
    <button class="sm" data-view="/ar/">العربية</button>
    <span class="sp"></span>
    <button class="sm" id="btnReload">Reload</button>
    <button class="sm" id="btnOpen">Open ↗</button>
  </div>
  <iframe id="frame" src="/" title="Live preview"></iframe>
</div>

<div id="toast"></div>
<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="jsonPick" accept="application/json" hidden>

<script>
'use strict';
const $ = s => document.querySelector(s);
const el = (t, a = {}, kids = []) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of [].concat(kids)) n.append(c);
  return n;
};
let DATA = null;
let dirty = false;

/* ---------- path helpers so every field binds generically ---------- */
const get = (o, p) => p.split('.').reduce((a, k) => a?.[k], o);
const set = (o, p, v) => {
  const ks = p.split('.'); const last = ks.pop();
  ks.reduce((a, k) => a[k], o)[last] = v;
  dirty = true;
};

function toast(msg, ms = 2200) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}

/* ---------- generic inputs ---------- */
function field(labelText, path, { multiline = false, rtl = false } = {}) {
  const v = get(DATA, path) ?? '';
  const input = el(multiline ? 'textarea' : 'input', { type: 'text' });
  input.value = v;
  if (rtl) input.setAttribute('dir', 'rtl');
  input.addEventListener('input', () => set(DATA, path, input.value));
  return el('label', {}, [el('span', { html: labelText }), input]);
}

function selectField(labelText, path, options) {
  const sel = el('select');
  for (const [val, txt] of options) {
    const o = el('option', { value: val }, txt);
    if (String(get(DATA, path)) === val) o.selected = true;
    sel.append(o);
  }
  sel.addEventListener('change', () => set(DATA, path, sel.value));
  return el('label', {}, [el('span', { html: labelText }), sel]);
}

function colourRow(name, path) {
  const hexInput = el('input', { type: 'text' });
  const picker   = el('input', { type: 'color' });
  const sync = v => {
    hexInput.value = v; picker.value = v;
    set(DATA, path, v); applyThemeLive();
  };
  hexInput.value = picker.value = get(DATA, path);
  picker.addEventListener('input', () => sync(picker.value));
  hexInput.addEventListener('change', () => {
    const v = hexInput.value.trim();
    if (/^#[0-9a-f]{6}$/i.test(v)) sync(v); else hexInput.value = get(DATA, path);
  });

  const sw = el('div', { class: 'swatches' },
    DATA.brandPalette.map(p => el('button', {
      class: 'sw', title: p.name + '  ' + p.hex, style: 'background:' + p.hex,
      onclick: () => sync(p.hex)
    })));

  return el('div', {}, [
    el('div', { class: 'crow' }, [el('span', { class: 'nm' }, name), picker, hexInput]),
    sw
  ]);
}

/* live theme push into the preview iframe — no rebuild needed */
const VARMAP = {
  background: '--bg', foreground: '--ink', heading: '--heading', accent: '--accent',
  invertBg: '--invert-bg', invertFg: '--invert-fg', heroInk: '--hero-ink',
  heroNavInk: '--hero-nav-ink', navSize: '--fs-nav'
};
function applyThemeLive() {
  const doc = $('#frame').contentDocument;
  // the iframe's load event can beat the site.json fetch, so DATA may still be null
  if (!doc || !DATA) return;
  for (const [k, cssVar] of Object.entries(VARMAP))
    doc.documentElement.style.setProperty(cssVar, DATA.theme[k]);
}

/* ---------- image picker ---------- */
function imageField(labelText, path) {
  const thumb = el('img', { src: get(DATA, path) || '', alt: '' });
  const txt   = el('input', { type: 'text' }); txt.value = get(DATA, path) || '';
  txt.addEventListener('input', () => { set(DATA, path, txt.value); thumb.src = txt.value; });

  const up = el('button', { class: 'sm', onclick: () => pickImage(p => {
    txt.value = p; thumb.src = p; set(DATA, path, p);
  }) }, 'Upload…');

  return el('div', { class: 'imgpick' }, [
    thumb,
    el('div', { class: 'col' }, [el('span', { class: 'nm', style: 'font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);display:block;margin-bottom:5px' }, labelText), txt]),
    up
  ]);
}

function pickImage(cb) {
  const inp = $('#filePick');
  inp.value = '';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    toast('Uploading ' + f.name + '…', 8000);
    const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(f); });
    const res = await fetch('/api/upload', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: f.name, data })
    }).then(r => r.json()).catch(e => ({ ok: false, error: String(e) }));
    if (res.ok) { cb(res.path); toast('Uploaded → ' + res.path); }
    else toast('Upload failed: ' + res.error, 4000);
  };
  inp.click();
}

/* ---------- repeatable list editor ---------- */
function listEditor(pane, title, path, spec, makeBlank) {
  const arr = get(DATA, path);
  const host = el('div');

  const redraw = () => {
    host.innerHTML = '';
    arr.forEach((row, i) => {
      const card = el('div', { class: 'item' });
      card.append(el('div', { class: 'hd' }, [
        el('strong', {}, (i + 1) + '. ' + (row[spec.titleKey] || '—')),
        el('button', { class: 'sm', title: 'Move up',   onclick: () => { if (i) { [arr[i-1], arr[i]] = [arr[i], arr[i-1]]; dirty = true; redraw(); } } }, '↑'),
        el('button', { class: 'sm', title: 'Move down', onclick: () => { if (i < arr.length - 1) { [arr[i+1], arr[i]] = [arr[i], arr[i+1]]; dirty = true; redraw(); } } }, '↓'),
        el('button', { class: 'sm danger', onclick: () => { arr.splice(i, 1); dirty = true; redraw(); } }, 'Delete')
      ]));

      const g = el('div', { class: 'grid2' });
      for (const f of spec.fields) {
        g.append(f.options
          ? selectField(f.label, `${path}.${i}.${f.key}`, f.options)
          : field(f.label, `${path}.${i}.${f.key}`, { multiline: f.multiline, rtl: spec.rtl }));
      }
      card.append(g);
      if (spec.image) card.append(imageField('Image', `${path}.${i}.img`));
      if (spec.soon) {
        const cb = el('input', { type: 'checkbox' });
        cb.checked = !!row.soon;
        cb.addEventListener('change', () => { row.soon = cb.checked; dirty = true; });
        card.append(el('label', { class: 'chk' }, [cb, document.createTextNode('Coming soon')]));
      }
      host.append(card);
    });
  };
  redraw();

  pane.append(el('fieldset', {}, [
    el('legend', {}, title),
    host,
    el('button', { class: 'sm', onclick: () => { arr.push(makeBlank()); dirty = true; redraw(); } }, '+ Add item')
  ]));
}

/* ---------- panes ---------- */
function buildTheme() {
  const p = $('#pane-theme'); p.innerHTML = '';
  p.append(el('p', { class: 'hint' },
    'Click a brand swatch or use the picker. Changes preview instantly on the right; press Save & Publish to write them into the site.'));

  const fs = el('fieldset', {}, [el('legend', {}, 'Page colours')]);
  fs.append(colourRow('Background',      'theme.background'));
  fs.append(colourRow('Body text',       'theme.foreground'));
  fs.append(colourRow('Headings',        'theme.heading'));
  fs.append(colourRow('Accent / hover',  'theme.accent'));
  p.append(fs);

  const fs2 = el('fieldset', {}, [el('legend', {}, 'Dark blocks (quote, footer, menu)')]);
  fs2.append(colourRow('Dark background', 'theme.invertBg'));
  fs2.append(colourRow('Dark text',       'theme.invertFg'));
  p.append(fs2);

  const fs3 = el('fieldset', {}, [el('legend', {}, 'Hero')]);
  fs3.append(colourRow('Logo & hero text', 'theme.heroInk'));
  fs3.append(colourRow('Hero menu & centre line', 'theme.heroNavInk'));
  p.append(fs3);

  const fsType = el('fieldset', {}, [el('legend', {}, 'Hero menu size')]);
  const NAV_OPTS = [
    ['var(--fs-sm)', 'Match small copy',
     'Shares the small step — 24.8px on a wide screen. Keeps the page to three sizes.'],
    ['calc(var(--u) * 1.4)', 'Larger',
     'A step up — 30.8px on a wide screen. Adds a fourth size.']
  ];
  NAV_OPTS.forEach(([val, name, note]) => {
    const id = 'nav-' + name;
    const radio = el('input', { type: 'radio', name: 'navSize', id });
    radio.checked = (DATA.theme.navSize || NAV_OPTS[0][0]) === val;
    radio.addEventListener('change', () => {
      if (!radio.checked) return;
      set(DATA, 'theme.navSize', val);
      applyThemeLive();
    });
    fsType.append(el('div', { class: 'crow' }, [
      radio,
      el('label', { for: id, style: 'flex:1;cursor:pointer;margin-inline-start:8px' }, [
        el('div', { class: 'nm' }, name),
        el('div', { style: 'font-size:11px;color:var(--dim);line-height:1.4' }, note)
      ])
    ]));
  });
  p.append(fsType);

  const fs4 = el('fieldset', {}, [el('legend', {}, 'Brand palette reference')]);
  fs4.append(el('div', { class: 'swatches' }, DATA.brandPalette.map(c =>
    el('div', { style: 'text-align:center;width:74px' }, [
      el('div', { style: `background:${c.hex};height:44px;border:1px solid var(--line);border-radius:2px` }),
      el('div', { style: 'font-size:10px;color:var(--dim);margin-top:4px;line-height:1.3' },
        c.name + ' ' + c.hex)
    ]))));
  p.append(fs4);
}

function buildLang(key) {
  const p = $('#pane-' + key); p.innerHTML = '';
  const rtl = key === 'ar';
  const o = { rtl };
  const T = k => `${key}.${k}`;

  p.append(el('fieldset', {}, [el('legend', {}, 'Page & SEO'),
    field('Browser title', T('title'), o),
    field('Meta description', T('metaDescription'), { multiline: true, rtl })]));

  p.append(el('fieldset', {}, [el('legend', {}, 'Navigation'),
    el('div', { class: 'grid2' }, [
      field('Studio', T('nav.studio'), o), field('Work', T('nav.work'), o),
      field('Collections', T('nav.collections'), o), field('Contact', T('nav.contact'), o),
      field('Menu', T('nav.menu'), o), field('Close', T('nav.close'), o)])]));

  p.append(el('fieldset', {}, [el('legend', {}, 'Hero'),
    field('Tagline (use &lt;br&gt; for a line break)', T('hero.tagline'), o),
    field('Scroll label', T('hero.scroll'), o)]));

  p.append(el('fieldset', {}, [el('legend', {}, '1 · Opening statement'),
    field('Large opening line', T('opening'), { multiline: true, rtl })]));

  p.append(el('fieldset', {}, [el('legend', {}, '2 · Intro note'),
    field('Small note', T('intro.note'), o),
    field('Paragraph', T('intro.body'), { multiline: true, rtl })]));

  p.append(el('fieldset', {}, [el('legend', {}, '3 · Work heading'),
    el('div', { class: 'grid2' }, [
      field('Label', T('workSection.eyebrow'), o),
      field('Count', T('workSection.count'), o)])]));

  listEditor(p, '3 · Projects (timeline)', `${key}.work`, {
    titleKey: 'name', rtl, image: true, soon: true,
    fields: [
      { label: 'Year (on the spine)', key: 'year' },
      { label: 'Name', key: 'name' },
      { label: 'Meta line', key: 'meta' },
      { label: 'Subtitle under name', key: 'sub' },
      { label: 'Side of spine', key: 'side', options: [['l', 'Left'], ['r', 'Right']] },
      { label: 'Width (of 16 columns)', key: 'span',
        options: [['4', '4 — small'], ['5', '5'], ['6', '6 — medium'], ['7', '7 — large']] },
      { label: 'Image shape', key: 'ar',
        options: [['3/4', 'Portrait'], ['1/1', 'Square'], ['4/3', 'Landscape'], ['16/10', 'Wide']] }
    ]
  }, () => ({ num: '', year: '2026', name: 'New project', meta: '', sub: '',
              side: 'l', span: '6', ar: '4/3', img: '/assets/img/work-01.jpg', soon: true }));

  p.append(el('fieldset', {}, [el('legend', {}, '4 · Chapter one'),
    field('Big heading (Enter = new line)', T('chapter1.heading'), { multiline: true, rtl }),
    field('Paragraph', T('chapter1.body'), { multiline: true, rtl }),
    field('Side note (Enter = new line)', T('chapter1.note'), { multiline: true, rtl }),
    field('Side link label', T('chapter1.noteLink'), o)]));

  p.append(el('fieldset', {}, [el('legend', {}, '5 · Chapter two'),
    field('Big heading', T('chapter2.heading'), { multiline: true, rtl }),
    field('Small note', T('chapter2.note'), o),
    field('Pull quote', T('chapter2.quote'), { multiline: true, rtl }),
    field('Quote source', T('chapter2.quoteSource'), o),
    field('Paragraph', T('chapter2.body'), { multiline: true, rtl }),
    field('Image caption', T('chapter2.caption'), o)]));

  p.append(el('fieldset', {}, [el('legend', {}, '6 · Chapter three'),
    field('Paragraph', T('chapter3.body'), { multiline: true, rtl }),
    field('Note 1', T('chapter3.note1'), { multiline: true, rtl }),
    field('Note 2', T('chapter3.note2'), { multiline: true, rtl })]));

  p.append(el('fieldset', {}, [el('legend', {}, '7 · Closing'),
    field('Image caption', T('closing.caption'), o),
    field('Closing statement', T('closingStatement'), { multiline: true, rtl })]));

  p.append(el('fieldset', {}, [el('legend', {}, '8 · Footer'),
    el('div', { class: 'grid2' }, [
      field('Credit line', T('footer.credit'), o),
      field('Rights line', T('footer.rights'), o),
      field('Privacy link', T('footer.privacy'), o),
      field('Contact link', T('footer.talk'), o),
      field('Place', T('footer.place'), o)])]));

  listEditor(p, '2 · Intro image captions', `${key}.features`, {
    titleKey: 'caption', rtl,
    fields: [{ label: 'Caption', key: 'caption' }, { label: 'Alt text', key: 'alt' }]
  }, () => ({ caption: '', alt: '' }));

}

function buildMedia() {
  const p = $('#pane-media'); p.innerHTML = '';
  p.append(el('p', { class: 'hint' },
    'Hero images cross-fade as the visitor scrolls the opening screen. Upload replaces the file on disk and points the site at it.'));

  const heroFs = el('fieldset', {}, [el('legend', {}, 'Hero sequence')]);
  DATA.images.hero.forEach((_, i) =>
    heroFs.append(imageField('Hero frame ' + (i + 1), `images.hero.${i}`)));
  heroFs.append(el('button', { class: 'sm', onclick: () => {
    DATA.images.hero.push('/assets/img/hero-1.jpg'); dirty = true; buildMedia();
  } }, '+ Add frame'));
  if (DATA.images.hero.length > 1) {
    heroFs.append(el('button', { class: 'sm danger', style: 'margin-left:8px',
      onclick: () => { DATA.images.hero.pop(); dirty = true; buildMedia(); } }, '− Remove last'));
  }
  p.append(heroFs);

  const featFs = el('fieldset', {}, [el('legend', {}, 'Intro image row (section 2)')]);
  DATA.images.feature.forEach((_, i) =>
    featFs.append(imageField('Image ' + (i + 1), `images.feature.${i}`)));
  p.append(featFs);

  p.append(el('fieldset', {}, [el('legend', {}, 'Chapter & closing images'),
    imageField('Chapter one (section 4)', 'images.chapter1'),
    imageField('Chapter two (section 5)', 'images.chapter2'),
    imageField('Closing full-width (section 7)', 'images.closing'),
    imageField('Texture inside the big footer logo', 'images.wordmarkFill')]));

  p.append(el('fieldset', {}, [el('legend', {}, 'Contact details'),
    el('div', { class: 'grid2' }, [
      field('Email', 'contact.email'), field('Phone (display)', 'contact.phone'),
      field('Phone (link)', 'contact.phoneHref'), field('Instagram URL', 'contact.instagram'),
      field('LinkedIn URL', 'contact.linkedin'), field('Pinterest URL', 'contact.pinterest')])]));
}

function buildAll() { buildTheme(); buildLang('en'); buildLang('ar'); buildMedia(); }

/* ---------- tabs ---------- */
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => {
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === t));
  document.querySelectorAll('.pane').forEach(x =>
    x.classList.toggle('on', x.id === 'pane-' + t.dataset.pane));
}));

/* ---------- preview controls ---------- */
document.querySelectorAll('[data-view]').forEach(b =>
  b.addEventListener('click', () => { $('#frame').src = b.dataset.view; }));
$('#btnReload').addEventListener('click', () => { $('#frame').contentWindow.location.reload(); });
$('#btnOpen').addEventListener('click', () => window.open($('#frame').src || '/', '_blank'));
$('#frame').addEventListener('load', applyThemeLive);

/* ---------- save / export / import ---------- */
$('#btnSave').addEventListener('click', async () => {
  toast('Saving…', 8000);
  const res = await fetch('/api/content', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(DATA)
  }).then(r => r.json()).catch(e => ({ ok: false, error: String(e) }));
  if (res.ok) {
    dirty = false;
    toast('Published — site rebuilt');
    $('#frame').contentWindow.location.reload();
  } else {
    toast('Save failed: ' + res.error, 5000);
  }
});

$('#btnExport').addEventListener('click', () => {
  const blob = new Blob([JSON.stringify(DATA, null, 2)], { type: 'application/json' });
  const a = el('a', { href: URL.createObjectURL(blob), download: 'ajid-site.json' });
  document.body.append(a); a.click(); a.remove();
});

$('#btnImport').addEventListener('click', () => {
  const inp = $('#jsonPick'); inp.value = '';
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    try {
      DATA = JSON.parse(await f.text());
      buildAll(); applyThemeLive(); dirty = true;
      toast('Loaded ' + f.name + ' — press Save to publish');
    } catch (e) { toast('Not a valid JSON file', 4000); }
  };
  inp.click();
});

addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- boot ---------- */
fetch('/api/content')
  .then(r => r.json())
  .then(d => { DATA = d; buildAll(); })
  .catch(() => {
    document.body.innerHTML =
      '<p style="padding:40px;font-family:Georgia,serif;color:#d5cfc6">' +
      'The admin panel needs the AJID server. Run <code>python server.py</code> ' +
      'from the project folder, then open <code>http://localhost:3020/admin.html</code>.</p>';
  });
</script>
</body>
</html>
